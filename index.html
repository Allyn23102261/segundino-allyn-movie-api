<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Movie Collection</title>
<style>
  body { font-family: Arial, sans-serif; background: #f2f2f2; margin: 0; padding: 40px 20px; }
  .container { max-width: 700px; margin: 0 auto; background: #fff; padding: 30px 40px; border-radius: 6px; }
  h1 { text-align: center; }
  h2 { margin-top: 30px; }
  form { display: flex; gap: 8px; flex-wrap: wrap; }
  input { flex: 1; min-width: 120px; padding: 6px 8px; }
  button { padding: 6px 14px; cursor: pointer; }
  #status { font-weight: bold; margin-top: 8px; min-height: 1.2em; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; }
  th { background: #eee; }
</style>
</head>
<body>
<div class="container">
  <h1>Movie Collection</h1>

  <h2>Add Movie</h2>
  <form id="movie-form">
    <input type="text" id="title" placeholder="Title" required />
    <input type="text" id="genre" placeholder="Genre" required />
    <input type="number" id="year" placeholder="Year" required />
    <button type="submit">Add Movie</button>
  </form>
  <div id="status"></div>

  <h2>Movies</h2>
  <button id="load-btn">Load Movies</button>
  <table>
    <thead>
      <tr><th>ID</th><th>Title</th><th>Genre</th><th>Year</th></tr>
    </thead>
    <tbody id="movie-list"></tbody>
  </table>
</div>

<script>
const form = document.getElementById('movie-form');
const statusEl = document.getElementById('status');
const listEl = document.getElementById('movie-list');
const loadBtn = document.getElementById('load-btn');

async function loadMovies() {
  const res = await fetch('/api/movies');
  const movies = await res.json();
  listEl.innerHTML = movies.map(m =>
    `<tr><td>${m.id}</td><td>${m.title}</td><td>${m.genre}</td><td>${m.year}</td></tr>`
  ).join('');
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const title = document.getElementById('title').value;
  const genre = document.getElementById('genre').value;
  const year = document.getElementById('year').value;

  const res = await fetch('/api/movies', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title, genre, year })
  });

  const data = await res.json();

  if (!res.ok) {
    statusEl.textContent = data.error || 'Something went wrong';
    return;
  }

  statusEl.textContent = 'Movie added successfully';
  form.reset();
  loadMovies();
});

loadBtn.addEventListener('click', loadMovies);

loadMovies();
</script>
</body>
</html>
